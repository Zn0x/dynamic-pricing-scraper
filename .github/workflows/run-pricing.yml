name: Scheduled Dynamic Pricing Pipeline

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (ajustable con cron)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite disparar la ejecución manualmente con un clic en GitHub Actions

jobs:
  run-pricing-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Deps
        run: |
          playwright install --with-deps chromium

      - name: Execute Pricing Automation
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          MAIL_BOT: ${{ secrets.MAIL_BOT }}
          PASS_APP: ${{ secrets.PASS_APP }}
          AUTH_CODE_REGEX: ${{ secrets.AUTH_CODE_REGEX }}
          GOOGLE_CREDS_FILE: 'credentials.json'
          HOJA_PANEL_CONTROL: ${{ secrets.HOJA_PANEL_CONTROL }}
          HOJA_REPRICING: ${{ secrets.HOJA_REPRICING }}
        run: |
          python main.py

      - name: Upload Artifacts (Screenshots on Failure / Downloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-artifacts
          path: |
            *.png
            artifacts/
            downloads/
          retention-days: 3